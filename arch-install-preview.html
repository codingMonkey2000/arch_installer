<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arch Linux GNOME Installer — Preview</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060c18;min-height:100vh;display:flex;flex-direction:column;align-items:center;
     justify-content:flex-start;padding:28px 12px 40px;
     font-family:'Courier New',Courier,monospace;color:#b8cce8}

/* ── Page header ── */
.page-header{width:720px;max-width:100%;margin-bottom:18px;display:flex;
             align-items:center;justify-content:space-between}
.page-title{color:#3a6aaa;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}
.page-ver{color:#253a5a;font-size:11px}

/* ── Terminal chrome ── */
.term{width:720px;max-width:100%;background:#07101f;border-radius:10px;
      box-shadow:0 8px 60px #000c,0 0 0 1px #0e1e3a}
.term-bar{background:#0d1a2e;display:flex;align-items:center;gap:7px;padding:9px 14px;
          border-bottom:1px solid #142034;border-radius:10px 10px 0 0}
.dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.term-label{color:#253a5a;font-size:10px;margin-left:auto;letter-spacing:.5px}
.screen{background:#060e1e;padding:8px 10px 0;border-radius:0 0 10px 10px}
.backtitle{color:#2a4e7a;font-size:10.5px;padding:3px 5px 6px;
           border-bottom:1px solid #0d1a2e;margin-bottom:8px;letter-spacing:.3px}
.stage{min-height:390px;display:flex;align-items:center;justify-content:center;padding:8px}

/* ── Dialog box ── */
.dlg{background:#0f1e38;border:1px solid #1e3a6a;width:100%;max-width:560px}
.dlg-title{background:#091428;text-align:center;padding:5px 14px;color:#c8dff8;
           font-weight:bold;border-bottom:1px solid #1a3060;font-size:13px;letter-spacing:.5px}
.dlg-body{padding:16px 20px;color:#a0bcd8;font-size:12.5px;line-height:1.6;min-height:180px}
.dlg-btns{background:#060e1e;padding:9px 14px;display:flex;justify-content:center;
          gap:18px;border-top:1px solid #0e2040}

/* ── Buttons ── */
.btn-p{background:#1464b4;color:#d0ecff;padding:3px 18px;cursor:pointer;
       font-family:monospace;font-size:12.5px;border:none;border-radius:1px;
       box-shadow:inset 0 -2px 0 #0a3a70}
.btn-p:hover{background:#1a7ad0}
.btn-s{background:#0a1428;color:#6a90b8;padding:3px 18px;cursor:pointer;
       font-family:monospace;font-size:12.5px;border:1px solid #1e3560;border-radius:1px}
.btn-s:hover{background:#0e1e3c;color:#90b0d8}

/* ── Colour helpers ── */
.hl {color:#40d0ff}.red{color:#ff5a5a}.grn{color:#00cc77}
.yel{color:#ffc840}.mu {color:#3a5878}.cy {color:#00c8c0}

/* ── Form rows ── */
.form-row{display:flex;align-items:center;gap:10px;margin:6px 0}
.form-lbl{color:#6a90b8;min-width:140px;text-align:right;font-size:12px}
.form-inp{background:#030a18;border:1px solid #1a3060;color:#80b0d8;
          padding:2px 8px;font-family:monospace;font-size:12px;width:210px}
.form-pw {background:#030a18;border:1px solid #1a3060;color:#1e3060;
          padding:2px 8px;font-family:monospace;font-size:12px;width:210px;letter-spacing:5px}
.form-hint{color:#2a4060;font-size:10.5px;margin-top:2px;margin-left:152px}

/* ── Lists ── */
.list-box{border:1px solid #122040;background:#030a18;
          max-height:180px;overflow-y:auto;font-size:12px}
.list-item{padding:3px 12px;color:#7090b8;cursor:pointer;display:flex;gap:14px;align-items:center}
.list-item:hover{background:#0c1a30}
.list-item.sel{background:#1464b4;color:#d0ecff}
.list-item .radio{min-width:14px;color:#2a4870}
.list-item.sel .radio{color:#80c0ff}

/* ── Preflight ── */
.check-row{display:flex;align-items:flex-start;gap:10px;margin:5px 0;font-size:12.5px}
.ck-ok {color:#00cc77}.ck-err{color:#ff5a5a}.ck-inf{color:#00c8c0}

/* ── Gauge ── */
.gauge-wrap{border:1px solid #1a3060;background:#030a18;height:19px;margin:8px 0;overflow:hidden}
.gauge-bar{height:100%;background:linear-gradient(90deg,#0a50a0,#1a90e0);
           display:flex;align-items:center;justify-content:flex-end;
           padding-right:6px;font-size:10px;color:#a0d0ff;font-weight:bold;
           transition:width .6s ease}
.step-log{height:126px;overflow-y:auto;border:1px solid #0a1830;
          background:#020810;padding:5px 8px;font-size:10.5px;line-height:1.65}
.step-done  {color:#00aa66}
.step-active{color:#ffc840}
.step-wait  {color:#1e3050}

/* ── Summary table ── */
.sum-row{display:grid;grid-template-columns:140px 1fr;gap:2px 10px;
         font-size:12px;line-height:1.9;margin:2px 0}
.sum-key{color:#4a7298;text-align:right}
.sum-val{color:#60c0ff}

/* ── Section separator ── */
.sep{border:none;border-top:1px solid #0e2040;margin:10px 0}

/* ── Nav ── */
.nav-row{width:720px;max-width:100%;display:flex;align-items:center;
         justify-content:space-between;padding:12px 4px 0}
.nav-btn{background:#08111e;color:#3a6080;border:1px solid #112030;
         padding:6px 20px;font-size:11px;cursor:pointer;font-family:monospace;
         border-radius:4px;transition:all .15s}
.nav-btn:hover:not(:disabled){background:#0e1e32;color:#60a0c0;border-color:#1e3a5a}
.nav-btn:disabled{opacity:.2;cursor:default}
.pips{display:flex;gap:7px;align-items:center}
.pip{width:8px;height:8px;border-radius:50%;background:#0e1e30;transition:all .2s}
.pip.done  {background:#1464b4}
.pip.active{background:#40d0ff;box-shadow:0 0 6px #40d0ff88}
.screen-label{color:#1e3a5a;font-size:10px;margin-top:4px;text-align:center}

/* ── Warning box ── */
.warn-box{border:1px solid #5a1010;background:#120404;padding:8px 12px;
          font-size:11.5px;margin-top:8px}

/* ── Disk list ── */
.disk-item{display:flex;gap:0;padding:3px 10px;cursor:pointer;align-items:center}
.disk-item:hover{background:#0a1628}
.disk-item.sel{background:#1464b4;color:#d0ecff}
.disk-col-1{min-width:130px;font-size:12px}
.disk-col-2{min-width:65px;font-size:11.5px;color:#4a7090}
.disk-col-3{font-size:11.5px;color:#4a7090}
.disk-item.sel .disk-col-2,.disk-item.sel .disk-col-3{color:#90c8e8}

/* ── Checklist ── */
.chk-item{padding:4px 12px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12px}
.chk-item:hover{background:#0a1628}
.chkbox{color:#1464b4;min-width:16px}.chkbox.on{color:#40d0ff}
.chk-label{color:#7090b8;line-height:1.4}
.chk-item.on .chk-label{color:#a0c4e0}

/* Scroll bars */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#030a18}
::-webkit-scrollbar-thumb{background:#1a3060;border-radius:3px}
</style>
</head>
<body>

<div class="page-header">
  <span class="page-title">⚡ arch-install-tui.sh — screen preview</span>
  <span class="page-ver">v1.2.0</span>
</div>

<div class="term">
  <div class="term-bar">
    <div class="dot" style="background:#ff5f57"></div>
    <div class="dot" style="background:#febc2e"></div>
    <div class="dot" style="background:#28c840"></div>
    <div class="term-label">root@archiso — ./arch-install-tui.sh</div>
  </div>
  <div class="screen">
    <div class="backtitle">&nbsp;Arch Linux&nbsp;∙&nbsp;GNOME 50+&nbsp;∙&nbsp;v1.2.0&nbsp;</div>
    <div class="stage" id="stage"></div>
  </div>
</div>

<div class="nav-row">
  <button class="nav-btn" id="btn-back" onclick="go(-1)">◀  Back</button>
  <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
    <div class="pips" id="pips"></div>
    <div class="screen-label" id="screen-label"></div>
  </div>
  <button class="nav-btn" id="btn-next" onclick="go(1)">Next  ▶</button>
</div>

<script>
let cur = 0, gTimer = null, gStep = 0;

const SCREENS = [
  { title:' Welcome ',                    fn: sWelcome    },
  { title:' ✔ Pre-flight Checks ',        fn: sPreflight  },
  { title:' User Account  (1/4) ',        fn: sAccount    },
  { title:' Locale & Language  (1/2) ',   fn: sLocale     },
  { title:' Timezone  (1/2) ',            fn: sTimezone   },
  { title:' Disk Selection ',             fn: sDisk       },
  { title:' Feature Selection ',          fn: sFeatures   },
  { title:' Installation Summary ',       fn: sSummary    },
  { title:' Installing Arch Linux ',      fn: sProgress   },
  { title:' ✔  Installation Complete ',   fn: sComplete   },
];

function go(d) {
  clearInterval(gTimer);
  cur = Math.max(0, Math.min(SCREENS.length - 1, cur + d));
  render();
  if (cur === 8) startGauge();
}

function btn(label, primary, fn) {
  return `<button class="${primary?'btn-p':'btn-s'}" onclick="${fn}">${label}</button>`;
}

function render() {
  const s = SCREENS[cur];
  const { body, btns } = s.fn();
  document.getElementById('stage').innerHTML =
    `<div class="dlg"><div class="dlg-title">${s.title}</div>`+
    `<div class="dlg-body">${body}</div>`+
    `<div class="dlg-btns">${btns}</div></div>`;
  document.getElementById('btn-back').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === SCREENS.length - 1;
  document.getElementById('pips').innerHTML =
    SCREENS.map((_,i)=>`<div class="pip ${i===cur?'active':i<cur?'done':''}"></div>`).join('');
  document.getElementById('screen-label').textContent =
    `${cur+1} / ${SCREENS.length}`;
}

/* ── Screens ──────────────────────────────────────────────────────────── */

function sWelcome() {
  return {
    body:`
<pre style="color:#183060;font-size:10px;line-height:1.25;margin-bottom:10px;user-select:none">
   _____            __       __    _
  /  _  \\ ________/ /_     / /   (_)__  __  ___
 /  /_\\  / ___/ __/ __ \\  / /   / / _ \\/ / / /
/    |   / /  / /__/ / / // /___/ /  __/ /_/ /
\\____|__/_/   \\___/_/ /_//_____/_/\\___/\\____/</pre>
<p style="color:#5a8ab0;font-size:12px;margin-bottom:12px">
  Complete Arch Linux installer with GNOME 50+ desktop.
</p>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;font-size:12px;margin-bottom:12px">
  <span><span class="yel">●</span> AMD Ryzen 9 9950X</span>
  <span><span class="yel">●</span> NVIDIA RTX 5090</span>
  <span><span class="yel">●</span> ASRock X670E Taichi</span>

</div>
<hr class="sep">
<p class="red" style="font-size:12px">⚠ The target disk will be <strong>COMPLETELY ERASED</strong>.</p>`,
    btns: btn('  Begin  ',true,'go(1)') + btn('  Exit  ',false,'')
  };
}

function sPreflight() {
  const rows = [
    ['ok','UEFI boot mode detected'],

    ['inf','Hyper-V detected — NVIDIA drivers will be skipped'],

  return {
    body:`
<p style="font-size:12px;color:#5a80a0;margin-bottom:10px">System checks before installation begins:</p>
${rows.map(([t,m])=>`
<div class="check-row">
  <span class="${t==='ok'?'ck-ok':t==='inf'?'ck-inf':'ck-err'}">${t==='ok'?'✔':t==='inf'?'ℹ':'✗'}</span>
  <span style="font-size:12.5px">${m}</span>
</div>`).join('')}
<hr class="sep" style="margin-top:12px">
<p style="font-size:11.5px;color:#2a4060">Press Enter to continue.</p>`,

</div>

  <input class="form-inp" value="archbox" style="pointer-events:none" readonly>
</div>
<p class="form-hint">Letters, numbers, hyphens. Example: archbox</p>`,

function sDisk() {
  return {
    body:`
<p class="red" style="font-size:12px;margin-bottom:8px">⚠ The selected disk will be <strong>COMPLETELY ERASED</strong>.</p>
<div class="list-box">

</div>`,
    btns: btn('  ERASE &amp; INSTALL  ',true,'go(1)') + btn('  Back  ',false,'go(-1)')

  const items = [
    { label:'Full dev environment  (Docker, Rust, Node, Python…)', on:true  },
    { label:'yay AUR helper  +  VS Code, Brave, Postman, Timeshift', on:true  },

/* ── Gauge animation ──────────────────────────────────────────────────── */
function startGauge() {
  gStep = 0;
  clearInterval(gTimer);
  gTimer = setInterval(()=>{
    if (gStep >= STEPS.length){ clearInterval(gTimer); return; }
    const [pct, msg] = STEPS[gStep++];
    const bar = document.getElementById('g-bar');
    if (!bar){ clearInterval(gTimer); return; }
    document.getElementById('g-bar').style.width = pct+'%';
    document.getElementById('g-pct').textContent  = pct+'%';
    document.getElementById('g-msg').textContent  = msg;
    const log = document.getElementById('g-log');
    log.querySelectorAll('.step-active').forEach(el=>{
      el.className='step-done';
      el.textContent='✔  '+el.textContent.slice(3);
    });
    const line = document.createElement('div');
    line.className = pct===100?'step-done':'step-active';
    line.textContent = (pct===100?'✔  ':'›  ')+msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }, 700);
}

render();
</script>
</body>
